# Alle Klassen unter src/ werden automatisch als Dienste registriert. Die
# Rückrufe der Einstellungsmaske greifen über ihre #[AsCallback]-Attribute,
# die Werkzeuge über die Schnittstelle ToolInterface (Tag contao_claude.tool),
# die Bereinigung über #[AsCronJob]. Ausgenommen sind die Klassen, die
# Symfony bzw. der Contao Manager selbst laden, die Ressourcen, das
# klassische Backend-Modul (erzeugt Contao mit „new“), der DataContainer
# für das Schreiben (je Vorgang neu erzeugt) und die reinen Wertobjekte und
# Hilfsklassen ohne Zustand.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $uploadPath: '%contao.upload_path%'
            string $previewScript: '%contao.preview_script%'
            # Protokollsitzungen des älteren MCP-Verfahrens (nur Protokolldaten)
            string $sessionDirectory: '%kernel.project_dir%/var/claude/mcp-sessions'
            iterable $tools: !tagged_iterator contao_claude.tool

    _instanceof:
        Schachbulle\ContaoClaudeBundle\Tool\ToolInterface:
            tags: ['contao_claude.tool']

    Schachbulle\ContaoClaudeBundle\:
        resource: '../../'
        exclude:
            - '../../ContaoClaudeBundle.php'
            - '../../ContaoManager/'
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../Backend/ConnectionsModule.php'
            - '../../Mcp/HttpBridge.php'
            - '../../OAuth/OAuthClient.php'
            - '../../OAuth/OAuthException.php'
            - '../../OAuth/Pkce.php'
            - '../../OAuth/RedirectUriMatcher.php'
            - '../../OAuth/Scopes.php'
            - '../../Security/AuthenticatedClient.php'
            - '../../Security/LoginFailedException.php'
            - '../../Write/CapturedRedirect.php'
            - '../../Write/WriteDataContainer.php'

    # Den Dienst gibt es erst ab Contao 5; unter 4.13 bleibt das Argument null
    Schachbulle\ContaoClaudeBundle\Data\ContentUrls:
        arguments:
            $contentUrlGenerator: '@?contao.routing.content_url_generator'

    # http_client registriert Contao nicht in jeder Fassung; ohne ihn baut
    # die Klasse sich einen eigenen Client
    Schachbulle\ContaoClaudeBundle\OAuth\ClientRegistry:
        arguments:
            $cache: '@cache.app'
            $httpClient: '@?http_client'

    # Öffentlich, weil das klassische Backend-Modul der Verbindungen ihn über
    # System::getContainer() holt
    Schachbulle\ContaoClaudeBundle\OAuth\GrantRepository:
        public: true

    # Controller müssen öffentlich sein, damit der Router sie abrufen kann
    Schachbulle\ContaoClaudeBundle\Controller\McpController:
        public: true
        tags: ['controller.service_arguments']

    Schachbulle\ContaoClaudeBundle\Controller\OAuthMetadataController:
        public: true
        tags: ['controller.service_arguments']

    Schachbulle\ContaoClaudeBundle\Controller\TokenController:
        public: true
        tags: ['controller.service_arguments']

    Schachbulle\ContaoClaudeBundle\Controller\AuthorizeController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $csrf: '@contao.csrf.token_manager'

    Schachbulle\ContaoClaudeBundle\Write\BackendEnvironment:
        arguments:
            $csrf: '@contao.csrf.token_manager'

    Schachbulle\ContaoClaudeBundle\Write\FileWriter:
        arguments:
            $httpClient: '@?http_client'
